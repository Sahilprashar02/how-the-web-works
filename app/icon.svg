<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="web-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  {/* Dark Obsidian Base */}
  <rect width="64" height="64" rx="16" fill="#040711" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#web-grad)" stroke-width="2" opacity="0.8" />
  
  {/* Web Globe Circle */}
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#web-grad)" stroke-width="2" opacity="0.85" />
  <ellipse cx="32" cy="32" rx="26" ry="11" fill="none" stroke="url(#web-grad)" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.5" />
  
  {/* Left Code Bracket < */}
  <path d="M 21 22 L 13 32 L 21 42" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  {/* Right Code Bracket > */}
  <path d="M 43 22 L 51 32 L 43 42" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  {/* Forward Slash / */}
  <line x1="35" y1="20" x2="29" y2="44" stroke="url(#web-grad)" stroke-width="2.5" stroke-linecap="round" />
  
  {/* Center Glowing Packet Node */}
  <circle cx="32" cy="32" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="32" cy="32" r="1.5" fill="#ffffff" />
</svg>
